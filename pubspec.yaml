name: wing_sprint
description: "Wing Sprint — chicken courier arcade game."
publish_to: 'none'
version: 1.0.1+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2

  # --- web routing / attribution stack ---
  appsflyer_sdk: ^6.15.3
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.4
  firebase_app_check: ^0.3.2+10
  flutter_local_notifications: ^18.0.1
  connectivity_plus: ^6.1.0
  http: ^1.2.2
  device_info_plus: ^11.2.0
  flutter_secure_storage: ^10.0.0
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.4
  url_launcher: ^6.3.0
  # NOTE: keep file_picker on the Java-based 8.x line. 10.x+ is Kotlin-only
  # and ships its own KGP that collides with Flutter's built-in Kotlin
  # support, breaking GeneratedPluginRegistrant.
  file_picker: 8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  # Build-time only: used by tool/squash_art.dart to recompress the
  # full-screen loading artwork. Not shipped in the app.
  image: ^4.2.0

flutter_launcher_icons:
  # iOS: full image with no clipping.
  ios: true
  image_path_ios: "assets/icon2.png"
  remove_alpha_ios: true
  # Android: adaptive icon (supported on all devices since minSdk=30).
  #   background — shown behind the foreground in any mask shape.
  #   foreground — icon2_fg.png has 12 % transparent padding on each side
  #     so the chicken stays within the 72dp safe zone without being tiny.
  android: true
  image_path_android: "assets/icon2.png"   # legacy fallback (API < 26 only)
  adaptive_icon_background: "#071A2B"
  adaptive_icon_foreground: "assets/icon2_fg.png"
  min_sdk_android: 30

flutter:
  uses-material-design: true
  assets:
    - assets/
